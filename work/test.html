<!doctype html><html lang='zh'><head><meta charset='utf-8'><style>body{margin:0;padding:12px;background:#20242c}</style></head><body><div id="px-hud-root" class="px-root" aria-label="像素风ARPG游戏主界面模型">

  <div class="px-device" id="pxDevice">
    <!-- ============ 主世界区域 ============ -->
    <div class="px-world" id="pxWorld">
      <canvas id="pxMap" width="960" height="600" aria-label="开放世界地图"></canvas>

      <!-- 顶部中央：场景 / Boss 信息 -->
      <div class="px-topbar">
        <div class="px-zone">
          <i data-lucide="map-pin" aria-hidden="true"></i>
          <span>沙盒副本 · 落日平原</span>
          <em class="px-ch">CH.3</em>
        </div>
        <div class="px-world-event" id="pxEvent">
          <i data-lucide="waves" aria-hidden="true"></i><span>世界事件 · 深海入侵 04:32</span>
        </div>
        <div class="px-boss-track">
          <span class="px-bt-label">世界Boss</span>
          <div class="px-bt-chain" id="pxBossChain"></div>
        </div>
      </div>

      <!-- 小地图 右上 -->
      <div class="px-minimap">
        <canvas id="pxMini" width="150" height="150"></canvas>
        <div class="px-mm-coords" id="pxCoords">128 , 64</div>
      </div>

      <!-- 世界飘字层 -->
      <div class="px-floats" id="pxFloats"></div>

      <!-- ============ 左上：角色状态区 ============ -->
      <div class="px-hero-panel">
        <div class="px-portrait" id="pxPortrait">
          <div class="px-portrait-art" id="pxPortraitArt">🧕</div>
          <span class="px-lv">Lv.42</span>
        </div>
        <div class="px-bars">
          <div class="px-name-row">
            <span class="px-hero-name" id="pxHeroName">修女 · 赛琳娜</span>
            <span class="px-buff" id="pxBuff"><i data-lucide="shield" aria-hidden="true"></i>护盾</span>
          </div>
          <div class="px-bar px-hp">
            <div class="px-bar-fill" id="pxHpFill"></div>
            <span class="px-bar-txt" id="pxHpTxt">3120 / 3120</span>
          </div>
          <div class="px-bar px-st">
            <div class="px-bar-fill" id="pxStFill"></div>
            <span class="px-bar-txt" id="pxStTxt">体能 100</span>
          </div>
          <div class="px-bar px-exp">
            <div class="px-bar-fill" id="pxExpFill"></div>
            <span class="px-bar-txt">EXP 67%</span>
          </div>
        </div>
        <div class="px-resources">
          <span class="px-res"><i data-lucide="coins" aria-hidden="true"></i> 86,420</span>
          <span class="px-res"><i data-lucide="gem" aria-hidden="true"></i> 1,258</span>
          <span class="px-res px-ticket"><i data-lucide="ticket" aria-hidden="true"></i> 副本券 ×3</span>
        </div>
      </div>

      <!-- ============ 宠物栏：状态区下方 ============ -->
      <div class="px-pet-panel" id="pxPetPanel">
        <div class="px-pet-card px-pet-active" data-pet="0">
          <span class="px-pet-rank px-rank-orange">橙</span>
          <div class="px-pet-art">🐲</div>
          <div class="px-pet-info">
            <b>小火龙</b>
            <div class="px-pet-bar"><i style="width:88%"></i></div>
          </div>
        </div>
        <div class="px-pet-card" data-pet="1">
          <span class="px-pet-rank px-rank-purple">紫</span>
          <div class="px-pet-art">🦊</div>
          <div class="px-pet-info">
            <b>影狐</b>
            <div class="px-pet-bar"><i style="width:0%"></i></div>
          </div>
        </div>
        <div class="px-pet-card" data-pet="2">
          <span class="px-pet-rank px-rank-blue">蓝</span>
          <div class="px-pet-art">🐺</div>
          <div class="px-pet-info">
            <b>冰原狼</b>
            <div class="px-pet-bar"><i style="width:0%"></i></div>
          </div>
        </div>
      </div>

      <!-- 左侧玩法入口 -->
      <div class="px-side-entries">
        <button class="px-side-btn" data-entry="tower"><i data-lucide="building-2" aria-hidden="true"></i><span>爬塔<br><em>80层</em></span></button>
        <button class="px-side-btn" data-entry="raid"><i data-lucide="swords" aria-hidden="true"></i><span>团队<br><em>副本</em></span></button>
        <button class="px-side-btn" data-entry="trial"><i data-lucide="trophy" aria-hidden="true"></i><span>荣誉<br><em>试炼</em></span></button>
        <button class="px-side-btn" data-entry="dungeon"><i data-lucide="door-open" aria-hidden="true"></i><span>普通<br><em>副本</em></span></button>
      </div>

      <!-- ============ 右下：技能 + 背包 ============ -->
      <div class="px-action-area">
        <div class="px-quick-row">
          <button class="px-quick-btn" id="pxBagBtn" aria-label="背包"><i data-lucide="backpack" aria-hidden="true"></i><span>背包</span></button>
          <button class="px-quick-btn" id="pxWarehouseBtn" aria-label="仓库"><i data-lucide="warehouse" aria-hidden="true"></i><span>仓库</span></button>
          <button class="px-quick-btn" id="pxSwapBtn" aria-label="一键换装"><i data-lucide="shuffle" aria-hidden="true"></i><span>一键换装</span></button>
        </div>
        <div class="px-skill-cluster">
          <button class="px-skill px-skill-sub" data-skill="2" id="pxSkill2">
            <i data-lucide="sparkles" aria-hidden="true"></i>
            <span class="px-cd" id="pxCd2"></span><em class="px-sk-name">神圣新星</em>
          </button>
          <button class="px-skill px-skill-sub" data-skill="1" id="pxSkill1">
            <i data-lucide="heart-pulse" aria-hidden="true"></i>
            <span class="px-cd" id="pxCd1"></span><em class="px-sk-name">治疗术</em>
          </button>
          <button class="px-skill px-skill-ult" data-skill="0" id="pxSkill0">
            <i data-lucide="sun" aria-hidden="true"></i>
            <span class="px-cd" id="pxCd0"></span><em class="px-sk-name">复活圣光</em>
          </button>
          <button class="px-skill px-skill-atk" id="pxAttack" aria-label="普通攻击">
            <i data-lucide="sword" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- ============ 底部：武器栏（3把） ============ -->
      <div class="px-weapon-bar" id="pxWeaponBar">
        <button class="px-weapon" data-w="0">
          <span class="px-w-rarity px-q-gold"></span>
          <span class="px-w-icon">🗡️</span>
          <span class="px-w-name">雷鸣长剑</span>
          <span class="px-w-dmg">ATK 842</span>
          <span class="px-w-slot">1</span>
        </button>
        <button class="px-weapon px-w-active" data-w="1">
          <span class="px-w-rarity px-q-gold"></span>
          <span class="px-w-icon">🏹</span>
          <span class="px-w-name">穿云战弓</span>
          <span class="px-w-dmg">ATK 765</span>
          <span class="px-w-slot">2</span>
        </button>
        <button class="px-weapon" data-w="2">
          <span class="px-w-rarity px-q-purple"></span>
          <span class="px-w-icon">🔨</span>
          <span class="px-w-name">碎岩重锤</span>
          <span class="px-w-dmg">ATK 910</span>
          <span class="px-w-slot">3</span>
        </button>
      </div>

      <!-- 英雄切换条（底部武器栏上方） -->
      <div class="px-hero-switch" id="pxHeroSwitch">
        <button class="px-hs active" data-hero="0"><span>🧕</span><em>修女</em></button>
        <button class="px-hs" data-hero="1"><span>🐦</span><em>咕咕</em></button>
        <button class="px-hs" data-hero="2"><span>👿</span><em>小恶魔</em></button>
        <button class="px-hs" data-hero="3"><span>💀</span><em>亡灵术师</em></button>
        <button class="px-hs" data-hero="4"><span>🧑‍🔧</span><em>工程师</em></button>
      </div>
    </div>

    <!-- 设备外框信息条 -->
    <div class="px-chrome-bar">
      <span class="px-chrome-title"><i data-lucide="gamepad-2" aria-hidden="true"></i> 像素远征 · 主界面布局（俯视角 HUD）</span>
      <span class="px-chrome-hint">点击地图移动 · 攻击/技能消耗体能 · 闲置自动恢复</span>
    </div>
  </div>

  <!-- 背包弹层 -->
  <div class="px-modal-mask" id="pxBagMask" hidden>
    <div class="px-modal px-bag-modal" role="dialog" aria-label="背包">
      <header><b>背包</b><button id="pxBagClose" aria-label="关闭">✕</button></header>
      <div class="px-bag-grid" id="pxBagGrid"></div>
      <footer>装备分品质：<i class="px-q-dot px-q-white"></i>普通 <i class="px-q-dot px-q-blue"></i>蓝 <i class="px-q-dot px-q-purple"></i>紫 <i class="px-q-dot px-q-gold"></i>金（解锁装备技能）</footer>
    </div>
  </div>
</div>



<style>
#px-hud-root.px-root{
  --px-ink:#2b1d12;
  --px-parch:#f6e7c8;
  --px-panel:#3a2c1d;
  --px-panel-2:#4d3a26;
  --px-edge:#1c130b;
  --px-gold:#ffd34d;
  --px-orange:#ff9d3c;
  --px-purple:#b56bff;
  --px-blue:#54b4ff;
  --px-green:#7be069;
  --px-red:#ff5a52;
  --px-hp:#ff5a52;
  --px-st:#54d6ff;
  --px-exp:#ffd34d;
  --px-pixel-font:"Press Start 2P", "ZCOOL KuaiLe", monospace;
  --px-cn-font:"ZCOOL KuaiLe","Press Start 2P",sans-serif;
  all:initial;
  font-family:var(--px-cn-font);
  display:block;
  color:#f4ead4;
}
#px-hud-root *{box-sizing:border-box; image-rendering:pixelated;}
#px-hud-root button{font-family:var(--px-cn-font); cursor:pointer; color:inherit;}
.px-device{
  border:6px solid #14100a;
  border-radius:18px;
  background:#0e0b07;
  padding:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 0 2px #4a3823;
}
.px-world{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  border-radius:10px;
  overflow:hidden;
  background:#243a1e;
  border:3px solid #000;
  user-select:none;
  touch-action:none;
}
#pxMap{position:absolute; inset:0; width:100%; height:100%; display:block;}
.px-chrome-bar{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px 2px; font-size:13px; color:#cbb78f;
}
.px-chrome-title{display:flex; align-items:center; gap:8px; color:#ffe3a1;}
.px-chrome-hint{font-size:12px; color:#9b8a68;}

/* ---------- 顶部条 ---------- */
.px-topbar{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; z-index:20; pointer-events:none;
}
.px-zone{
  display:flex; align-items:center; gap:6px;
  background:linear-gradient(#4d3a26,#33241600), #3a2c1d;
  border:3px solid var(--px-edge); box-shadow:0 0 0 2px #6b5230, 0 4px 0 #000;
  padding:7px 14px; border-radius:4px; font-size:15px; color:#ffe9bd;
}
.px-zone i{width:16px; height:16px; color:var(--px-gold);}
.px-ch{font-style:normal; background:var(--px-gold); color:#4a2f08; border:2px solid #000; font-size:11px; padding:1px 6px; border-radius:3px;}
.px-world-event{
  display:flex; align-items:center; gap:6px;
  background:#16324a; border:3px solid #061622; box-shadow:0 0 0 2px #2f7fb8, 0 4px 0 #000;
  padding:7px 14px; border-radius:4px; font-size:14px; color:#a9e5ff;
  animation:pxPulse 1.6s steps(2) infinite;
}
.px-world-event i{width:15px;height:15px;}
@keyframes pxPulse{50%{box-shadow:0 0 0 2px #54b4ff, 0 0 18px #54b4ff, 0 4px 0 #000;}}
.px-boss-track{
  display:flex; align-items:center; gap:8px;
  background:rgba(20,14,8,.82); border:2px solid #000; padding:6px 10px; border-radius:4px;
}
.px-bt-label{font-size:12px; color:#ffcaa0;}
.px-bt-chain{display:flex; gap:5px;}
.px-bt-node{
  width:26px; height:26px; display:grid; place-items:center; font-size:14px;
  background:#2c2014; border:2px solid #000; border-radius:3px; opacity:.45;
}
.px-bt-node.done{opacity:1; background:#3f5a25;}
.px-bt-node.now{opacity:1; background:#7a3a1d; box-shadow:0 0 10px #ff9d3c; animation:pxPulse 1.2s steps(2) infinite;}

/* ---------- 小地图 ---------- */
.px-minimap{
  position:absolute; top:58px; right:12px; z-index:20;
  width:128px; border:3px solid #000; box-shadow:0 0 0 2px #8a6c3f, 0 4px 0 #000;
  border-radius:6px; overflow:hidden; background:#1d2a18;
}
#pxMini{display:block; width:100%; height:auto;}
.px-mm-coords{
  text-align:center; font-size:11px; line-height:18px;
  background:rgba(0,0,0,.7); color:#cfe8a8; font-family:var(--px-pixel-font);
}

/* ---------- 角色状态区 ---------- */
.px-hero-panel{
  position:absolute; top:12px; left:12px; z-index:20;
  display:flex; gap:9px; align-items:flex-start;
}
.px-portrait{
  position:relative; width:74px; height:74px; flex:none;
  border:3px solid var(--px-gold); box-shadow:0 0 0 2px #000, 0 4px 0 #000;
  border-radius:6px; background:#243a1e; overflow:hidden;
}
.px-portrait-art{
  width:100%; height:100%; display:grid; place-items:center; font-size:42px;
  background:radial-gradient(circle at 50% 35%, #6d8a4a, #2c3d20);
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4));
}
.px-lv{
  position:absolute; left:-2px; bottom:-2px;
  background:var(--px-gold); color:#4a2f08; border:2px solid #000;
  font-size:11px; padding:1px 6px; border-radius:3px;
}
.px-bars{width:210px;}
.px-name-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.px-hero-name{font-size:16px; color:#fff3d6; text-shadow:2px 2px 0 #000;}
.px-buff{
  display:inline-flex; align-items:center; gap:3px; font-size:11px;
  background:rgba(84,180,255,.25); border:1px solid var(--px-blue);
  color:#bfe8ff; padding:1px 6px; border-radius:8px; font-style:normal;
}
.px-buff i{width:11px;height:11px;}
.px-buff.off{display:none;}
.px-bar{
  position:relative; height:17px; margin-bottom:4px;
  border:2px solid #000; border-radius:3px; background:#1a120a; overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.px-bar-fill{height:100%; transition:width .18s steps(3);}
.px-hp .px-bar-fill{width:100%; background:repeating-linear-gradient(90deg,#ff6d64 0 8px,#e23b34 8px 10px);}
.px-st .px-bar-fill{width:100%; background:repeating-linear-gradient(90deg,#69e0ff 0 8px,#2fa9d8 8px 10px);}
.px-exp .px-bar-fill{width:67%; background:repeating-linear-gradient(90deg,#ffe07a 0 8px,#e6b52e 8px 10px);}
.px-exp{height:9px;}
.px-bar-txt{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:10px; color:#fff; text-shadow:1px 1px 0 #000; letter-spacing:.5px;
  font-family:var(--px-pixel-font);
}
.px-exp .px-bar-txt{font-size:8px;}
.px-resources{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
.px-res{
  display:inline-flex; align-items:center; gap:4px; font-size:12px;
  background:rgba(20,14,8,.78); border:2px solid #000; border-radius:4px; padding:2px 8px;
  color:#ffe3a1; font-style:normal;
}
.px-res i{width:12px;height:12px;}
.px-res .lucide-gem{color:var(--px-blue);}
.px-res .lucide-ticket{color:var(--px-orange);}

/* ---------- 宠物栏 ---------- */
.px-pet-panel{
  position:absolute; top:108px; left:12px; z-index:19;
  display:flex; flex-direction:column; gap:7px;
}
.px-pet-card{
  display:flex; align-items:center; gap:8px; width:188px;
  background:rgba(28,19,11,.85); border:2px solid #000; border-radius:5px;
  padding:5px 8px; opacity:.62; transition:transform .12s steps(2), opacity .12s;
}
.px-pet-card.px-pet-active{
  opacity:1; border-color:#6b5230; box-shadow:0 0 0 2px var(--px-orange), 0 3px 0 #000;
  background:linear-gradient(90deg,rgba(255,157,60,.22),rgba(28,19,11,.9));
}
.px-pet-card:not(.px-pet-active):hover{opacity:.9; transform:translateX(3px);}
.px-pet-rank{
  font-size:10px; font-style:normal; width:20px; text-align:center;
  border:1px solid #000; border-radius:3px; padding:1px 0;
}
.px-rank-orange{background:var(--px-orange); color:#3a1a02;}
.px-rank-purple{background:var(--px-purple); color:#fff;}
.px-rank-blue{background:var(--px-blue); color:#04223a;}
.px-pet-art{
  width:38px; height:38px; flex:none; display:grid; place-items:center; font-size:24px;
  background:#33452a; border:2px solid #000; border-radius:4px;
}
.px-pet-info{flex:1; min-width:0;}
.px-pet-info b{font-size:14px; display:block; color:#ffe9bd; margin-bottom:3px;}
.px-pet-bar{height:8px; background:#140d06; border:1px solid #000; border-radius:2px; overflow:hidden;}
.px-pet-bar i{display:block; height:100%; background:linear-gradient(90deg,#7be069,#46a837);}

/* ---------- 左侧玩法入口 ---------- */
.px-side-entries{
  position:absolute; left:12px; top:268px; z-index:18;
  display:flex; flex-direction:column; gap:9px;
}
.px-side-btn{
  position:relative; display:flex; align-items:center; gap:7px;
  width:92px; padding:6px 8px;
  background:linear-gradient(#5a4329,#3a2a18);
  border:2px solid #000; box-shadow:0 0 0 2px #7a5f38, 0 3px 0 #000;
  border-radius:5px; font-size:13px; color:#ffe9bd; text-align:left;
  transition:transform .1s steps(2);
}
.px-side-btn:hover{transform:translateX(4px); color:#fff;}
.px-side-btn:active{transform:translateY(2px);}
.px-side-btn i{width:18px; height:18px; color:var(--px-gold); flex:none;}
.px-side-btn span{line-height:1.15;}
.px-side-btn em{font-style:normal; font-size:11px; color:#ffd98a;}

/* ---------- 右下：技能 / 背包 ---------- */
.px-action-area{
  position:absolute; right:14px; bottom:96px; z-index:22;
  display:flex; align-items:flex-end; gap:14px;
}
.px-quick-row{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
.px-quick-btn{
  display:flex; align-items:center; gap:6px; justify-content:center;
  min-width:86px; padding:7px 10px; font-size:13px;
  background:linear-gradient(#4a3a26,#2c2014); color:#ffe9bd;
  border:2px solid #000; box-shadow:0 0 0 2px #6b5230, 0 3px 0 #000;
  border-radius:6px;
}
.px-quick-btn:hover{color:#fff;}
.px-quick-btn i{width:15px;height:15px; color:var(--px-gold);}
#pxSwapBtn{background:linear-gradient(#7a4f1d,#4a2c0d); box-shadow:0 0 0 2px var(--px-orange), 0 3px 0 #000;}
#pxSwapBtn i{color:#ffd98a;}
.px-skill-cluster{position:relative; width:196px; height:196px;}
.px-skill{
  position:absolute; border:3px solid #000; border-radius:50%;
  display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 38% 30%, #6a5234, #2e2012);
  box-shadow:0 4px 0 #000; transition:transform .08s steps(2);
}
.px-skill i{width:60%;height:60%;}
.px-skill:active{transform:translateY(3px); box-shadow:0 1px 0 #000;}
.px-skill-atk{
  right:0; bottom:0; width:86px; height:86px;
  background:radial-gradient(circle at 38% 30%, #d8b25c, #8a5a17);
  border-color:#3a2408; box-shadow:0 0 0 2px var(--px-gold), 0 4px 0 #000; z-index:3;
}
.px-skill-atk i{color:#fff3d6; width:56%;height:56%;}
.px-skill-ult{
  right:78px; bottom:40px; width:74px; height:74px;
  background:radial-gradient(circle at 38% 30%, #ffe58a, #b07f12);
  border-color:#3a2a05; box-shadow:0 0 0 2px #fff0b0, 0 4px 0 #000; z-index:2;
}
.px-skill-ult i{color:#6b4a06;}
.px-skill-sub{
  width:58px; height:58px;
}
.px-skill-sub i{color:#9fdcff;}
#pxSkill1{right:26px; bottom:96px;}
#pxSkill2{right:128px; bottom:120px;}
.px-sk-name{
  position:absolute; bottom:-19px; left:50%; transform:translateX(-50%);
  font-size:11px; font-style:normal; white-space:nowrap;
  color:#ffe9bd; text-shadow:1px 1px 0 #000; pointer-events:none;
}
.px-cd{
  position:absolute; inset:0; display:grid; place-items:center;
  background:rgba(8,6,4,.78); font-family:var(--px-pixel-font); font-size:14px;
  color:#fff; border-radius:50%; opacity:0; transition:opacity .12s;
}

</style>

<script>
(function(){
  const root = document.getElementById("px-hud-root");
  const world = root.querySelector("#pxWorld");
  const canvas = root.querySelector("#pxMap");
  const ctx = canvas.getContext("2d");
  const mini = root.querySelector("#pxMini");
  const mctx = mini.getContext("2d");
  const W = 960, H = 600, TILE = 40;
  const COLS = W/TILE, ROWS = H/TILE;

  /* ---------- 像素地形（分层噪声） ---------- */
  function rnd(x,y,s){ let n = Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453; return n-Math.floor(n); }
  function tileAt(c,r){
    if(c<4 && r>2 && r<11) return 2;                 // 水域
    if((c===4&&r>2&&r<11)) return 3;                 // 沙滩
    const n = rnd(c,r,1), n2 = rnd(c*2,r*2,2);
    if(n>.93) return 4;                               // 岩石
    if(n>.85) return 5;                               // 树丛
    if(n2>.8) return 1;                               // 深草
    return 0;                                         // 草地
  }
  const PAL = ["#5c8a3c","#4f7a34","#3f7fb8","#d9c179","#8d8678","#3a6b2f"];
  function drawTile(c,r){
    const t = tileAt(c,r), x=c*TILE, y=r*TILE;
    ctx.fillStyle = PAL[t]; ctx.fillRect(x,y,TILE,TILE);
    if(t===2){ // 水波
      ctx.fillStyle="rgba(255,255,255,.18)";
      const off = (performance.now()/600|0)%TILE;
      ctx.fillRect(x+6+((off)%20),y+10,12,3);
      ctx.fillRect(x+18-((off)%16),y+26,10,3);
    }
    if(t===5){ // 树
      ctx.fillStyle="#24471c"; ctx.fillRect(x+8,y+12,24,24);
      ctx.fillStyle="#2f5e26"; ctx.fillRect(x+12,y+6,16,12);
      ctx.fillStyle="#5a3d22"; ctx.fillRect(x+17,y+32,6,8);
      ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fillRect(x+12,y+8,6,4);
    }
    if(t===4){ // 岩石
      ctx.fillStyle="#6e685c"; ctx.fillRect(x+8,y+12,24,20);
      ctx.fillStyle="#a8a090"; ctx.fillRect(x+10,y+12,12,6);
      ctx.fillStyle="#544e44"; ctx.fillRect(x+8,y+28,24,4);
    }
    if(t===0||t===1){ // 草点
      const g = rnd(c,r,3);
      ctx.fillStyle = t? "#47702f":"#679a47";
      if(g>.55){ ctx.fillRect(x+8,y+10,3,6); ctx.fillRect(x+26,y+24,3,6); }
    }
    if(t===3){ ctx.fillStyle="#cbb268"; ctx.fillRect(x+8,y+14,5,3); ctx.fillRect(x+24,y+28,5,3); }
  }

  /* ---------- 实体 ---------- */
  const player = { x:480, y:300, tx:480, ty:300, dir:0, step:0, art:"🧕" };
  const monsterDefs = [
    {art:"👺",name:"草原小妖"},{art:"🦂",name:"沙蝎"},{art:"🧟",name:"亡灵"},
    {art:"👹",name:"巨魔"},{art:"🐗",name:"野猪王"}
  ];
  const monsters = [];
  function spawnMonsters(){
    let placed = 0, guard = 0;
    while(placed < 9 && guard < 400){
      guard++;
      const seed = guard * 13.7 + placed * 91.3;
      const c = 7+Math.floor(rnd(seed, placed, 9)*15);
      const r = 2+Math.floor(rnd(placed, seed, 3)*11);
      if(tileAt(c,r)===2||tileAt(c,r)===5||tileAt(c,r)===4) continue;
      const d = monsterDefs[placed%monsterDefs.length];
      monsters.push({x:c*TILE+20, y:r*TILE+20, art:d.art, name:d.name,
        hp:100, vx:(rnd(seed,1,5)-.5)*.3, vy:(rnd(seed,2,5)-.5)*.3, hit:0});
      placed++;
    }
  }
  spawnMonsters();

  /* 建筑设施 */
  const props = [
    {x:760,y:120,art:"🏪",label:"杂货商"},{x:830,y:150,art:"⚒️",label:"铁匠铺"},
    {x:120,y:420,art:"🏰",label:"营地"},{x:880,y:460,art:"💰",label:"宝箱"},
    {x:300,y:90,art:"🌵"},{x:600,y:470,art:"🪨"}
  ];
  /* 其他玩家（NPC） */
  const npcs = [
    {x:700,y:200,art:"🧙",name:"咕咕"},{x:250,y:300,art:"🧛",name:"小恶魔"},
    {x:560,y:150,art:"💀",name:"亡灵术师"}
  ];

  /* ---------- 飘字 ---------- */
  const floats = root.querySelector("#pxFloats");
  function floatText(x,y,text,cls){
    const r = world.getBoundingClientRect();
    const el = document.createElement("span");
    el.className = "px-dmg "+(cls||"hit");
    el.textContent = text;
    el.style.left = (x/W*r.width-14)+"px";
    el.style.top = (y/H*r.height-10)+"px";
    floats.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }

  /* ---------- 输入：点击/触摸移动 ---------- */
  function toWorld(e){
    const r = world.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)/r.width*W, y:(p.clientY-r.top)/r.height*H };
  }
  let moving=false;
  world.addEventListener("pointerdown", e=>{
    if(e.target.closest("button")||e.target.closest(".px-modal")||e.target.closest(".px-hero-panel")||
       e.target.closest(".px-pet-panel")||e.target.closest(".px-minimap")) return;
    const p = toWorld(e); player.tx=p.x; player.ty=p.y; moving=true;
  });
  world.addEventListener("pointermove", e=>{
    if(!moving) return;
    const p = toWorld(e); player.tx=p.x; player.ty=p.y;
  });
  addEventListener("pointerup", ()=>moving=false);

  /* ---------- 状态条 ---------- */
  let hp=3120, hpMax=3120, st=100, idle=0;
  const hpFill=root.querySelector("#pxHpFill"), stFill=root.querySelector("#pxStFill");
  const hpTxt=root.querySelector("#pxHpTxt"), stTxt=root.querySelector("#pxStTxt");
  function useSt(v){ if(st<v){return false;} st-=v; idle=0; return true; }
  function updateBars(){
    hp=Math.max(0,Math.min(hpMax,hp)); st=Math.max(0,Math.min(100,st));
    hpFill.style.width=(hp/hpMax*100)+"%";
    stFill.style.width=st+"%";
    hpTxt.textContent=Math.ceil(hp)+" / "+hpMax;
    stTxt.textContent="体能 "+Math.ceil(st);
    root.querySelectorAll(".px-skill").forEach(b=>{
      const cost=+b.dataset.cost||0;
      b.classList.toggle("low-st", st<cost && !b.classList.contains("px-skill-atk"));
    });
  }

  /* ---------- 战斗 ---------- */
  function nearestMonster(range){
    let best=null,bd=range;
    for(const m of monsters){
      const d=Math.hypot(m.x-player.x,m.y-player.y);
      if(d<bd){bd=d;best=m;}
    }
    return best;
  }
  function damageMonster(m,dmg,heal){
    const crit=Math.random()<.22;
    const v=heal?dmg:(crit?Math.round(dmg*1.8):dmg);
    if(heal){ hp=Math.min(hpMax,hp+v); floatText(player.x,player.y-30,"+"+v,"heal"); }
    else {
      m.hp-=v; m.hit=1;
      floatText(m.x,m.y-18,crit?"CRIT "+v:String(v),crit?"crit":"hit");
      if(m.hp<=0){
        floatText(m.x,m.y,"掉落 +12","heal");
        m.hp=100;
        let tries=0, t=4;
        do{
          m.x=60+rnd(Math.random()*99,tries+1,7)*840;
          m.y=60+rnd(tries+3,Math.random()*99,5)*480;
          t=tileAt(m.x/TILE|0,m.y/TILE|0); tries++;
        } while((t===2||t===4||t===5) && tries<60);
      }
    }
  }
  root.querySelector("#pxAttack").addEventListener("click",()=>{
    if(!useSt(8)){floatText(player.x,player.y-34,"体能不足","hit");return;}
    const m=nearestMonster(78);
    damageMonster(m,120+Math.random()*60);
    player.step=8;
  });
  const skillMeta=[
    {id:0,cost:45,cd:9,act:()=>{damageMonster(null,260,true); root.querySelector("#pxBuff").classList.remove("off");}},
    {id:1,cost:30,cd:6,act:()=>damageMonster(null,480,true)},
    {id:2,cost:35,cd:7,act:()=>{[0,1,2].forEach(i=>{const m=nearestMonster(140); if(m)damageMonster(m,200);});}}
  ];
  skillMeta.forEach(s=>{
    const btn=root.querySelector("#pxSkill"+s.id);
    btn.dataset.cost=s.cost;
    let remain=0;
    btn.addEventListener("click",()=>{
      if(remain>0||!useSt(s.cost)){if(!useSt(0))floatText(player.x,player.y-34,"体能不足","hit");return;}
      s.act(); remain=s.cd;
      btn.classList.add("cooling");
      const cdEl=root.querySelector("#pxCd"+s.id);
      const t=setInterval(()=>{
        remain-=.1; cdEl.textContent=Math.ceil(remain);
        if(remain<=0){clearInterval(t); btn.classList.remove("cooling"); cdEl.textContent="";}
      },100);
    });
  });

  /* ---------- 武器切换（3把，无缝） ---------- */
  const wBtns=[...root.querySelectorAll(".px-weapon")];
  wBtns.forEach(b=>b.addEventListener("click",()=>{
    wBtns.forEach(x=>x.classList.remove("px-w-active"));
    b.classList.add("px-w-active");
    floatText(player.x,player.y-34,"已切换 "+b.querySelector(".px-w-name").textContent,"heal");
  }));
  /* 一键换装 */
  root.querySelector("#pxSwapBtn").addEventListener("click",()=>{
    const order=[1,2,0];
    const cur=wBtns.findIndex(b=>b.classList.contains("px-w-active"));
    wBtns.forEach((x,i)=>x.classList.toggle("px-w-active",i===order[cur]));
    floatText(player.x,player.y-46,"一键换装完成！","crit");
  });

  /* ---------- 英雄切换（全部免费解锁） ---------- */
  const heroes=[
    {art:"🧕",name:"修女 · 赛琳娜",color:"#6d8a4a",sk:["复活圣光","治疗术","神圣新星"]},
    {art:"🐦",name:"咕咕",color:"#4a7d8a",sk:["远程专精","羽盾","疾风射击"]},
    {art:"👿",name:"小恶魔 · 焰",color:"#8a4a3a",sk:["地狱火","眩晕链","烈焰风暴"]},
    {art:"💀",name:"亡灵术师",color:"#6a5a8a",sk:["召唤恶魔","骨盾","亡者大军"]},
    {art:"🧑‍🔧",name:"工程师 · 波顿",color:"#8a7a4a",sk:["自动炮台","护甲包","超载轰炸"]}
  ];
  root.querySelectorAll(".px-hs").forEach(b=>{
    b.addEventListener("click",()=>{
      root.querySelectorAll(".px-hs").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      const h=heroes[+b.dataset.hero];
      player.art=h.art;
      root.querySelector("#pxPortraitArt").textContent=h.art;
      root.querySelector("#pxHeroName").textContent=h.name;
      h.sk.forEach((n,i)=>root.querySelector("#pxSkill"+i+" .px-sk-name").textContent=n);
      floatText(player.x,player.y-34,"已解锁英雄："+h.name.split(" · ")[0],"heal");
    });
  });

  /* ---------- 宠物出战切换 ---------- */
  root.querySelectorAll(".px-pet-card").forEach(c=>{
    c.addEventListener("click",()=>{
      root.querySelectorAll(".px-pet-card").forEach(x=>{
        x.classList.remove("px-pet-active");
        x.querySelector(".px-pet-bar i").style.width="0%";
      });
      c.classList.add("px-pet-active");
      c.querySelector(".px-pet-bar i").style.width="88%";
    });
  });

  /* ---------- 背包 / 仓库 ---------- */
  const mask=root.querySelector("#pxBagMask");
  const grid=root.querySelector("#pxBagGrid");
  const items=[
    {ic:"⚔️",q:"gold"},{ic:"🛡️",q:"purple"},{ic:"💍",q:"blue"},{ic:"👕",q:"white"},
    {ic:"🪄",q:"gold"},{ic:"👢",q:"purple"},{ic:"👑",q:"gold"},{ic:"🧤",q:"blue"},
    {ic:"📿",q:"white"},{ic:"🏹",q:"purple"},{ic:"🔮",q:"gold"},{ic:"",q:""},
    {ic:"🧪",q:"white"},{ic:"",q:""},{ic:"",q:""},{ic:"",q:""},
    {ic:"",q:""},{ic:"",q:""}
  ];
  items.forEach(it=>{
    const cell=document.createElement("div");
    cell.className="px-cell"+(it.q?" px-q-"+it.q+"-cell":"");
    cell.innerHTML = it.ic ? it.ic+'<span class="px-q-edge"></span>'+'<span class="px-c-tag">'+(it.q==="gold"?"★":"")+'</span>' : "";
    grid.appendChild(cell);
  });
  root.querySelector("#pxBagBtn").addEventListener("click",()=>mask.hidden=false);
  root.querySelector("#pxWarehouseBtn").addEventListener("click",()=>{
    mask.hidden=false; root.querySelector(".px-bag-modal header b").textContent="仓库";
  });
  root.querySelector("#pxBagClose").addEventListener("click",()=>{
    mask.hidden=true; root.querySelector(".px-bag-modal header b").textContent="背包";
  });
  mask.addEventListener("click",e=>{ if(e.target===mask){mask.hidden=true; root.querySelector(".px-bag-modal header b").textContent="背包";}});

  /* ---------- 左侧玩法入口提示 ---------- */
  root.querySelectorAll(".px-side-btn").forEach(b=>{
    const map={tower:"爬塔玩法 · 共80层，当前 47F",raid:"团队副本 · 4人组队",trial:"荣誉试炼 · 赛季排行榜",dungeon:"普通副本 · 副本券×3，Boss无限刷"};
    b.addEventListener("click",()=>floatText(player.x,player.y-58,map[b.dataset.entry],"heal"));
  });

  /* ---------- Boss 链 ---------- */
  const bossChain=root.querySelector("#pxBossChain");
  ["🗿","🪱","🐂","👁️"].forEach((ic,i)=>{
    const n=document.createElement("span");
    n.className="px-bt-node"+(i===0?" done":i===1?" now":"");
    n.textContent=ic; bossChain.appendChild(n);
  });

  /* ---------- 小地图 ---------- */
  function drawMini(){
    mctx.fillStyle="#243a1e"; mctx.fillRect(0,0,150,150);
    const s=150/COLS;
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
      const t=tileAt(c,r);
      if(t===2){mctx.fillStyle="#3f7fb8"; mctx.fillRect(c*s,r*s,s+1,s+1);}
      if(t===5){mctx.fillStyle="#2f5e26"; mctx.fillRect(c*s,r*s,s+1,s+1);}
    }
    mctx.fillStyle="#ff5a52";
    monsters.forEach(m=>mctx.fillRect(m.x/W*150-1.5,m.y/H*150-1.5,3,3));
    mctx.fillStyle="#54b4ff";
    npcs.forEach(n=>mctx.fillRect(n.x/W*150-1.5,n.y/H*150-1.5,3,3));
    mctx.fillStyle="#ffe98a";
    mctx.fillRect(player.x/W*150-2.5,player.y/H*150-2.5,5,5);
    mctx.strokeStyle="#8a6c3f"; mctx.lineWidth=2; mctx.strokeRect(1,1,148,148);
  }

  /* ---------- 主循环 ---------- */
  let last=performance.now();
  function pxSprite(x,y,art,size,bounce){
    ctx.font=size+"px serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(art,x,y+bounce);
  }
  function loop(now){
    const dt=Math.min(48,now-last)/16.7; last=now;
    ctx.clearRect(0,0,W,H);
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++) drawTile(c,r);

    /* 玩家移动 */
    const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy);
    if(d>3){
      const sp=2.6*dt;
      player.x+=dx/d*Math.min(sp,d); player.y+=dy/d*Math.min(sp,d);
      player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
      player.step=(player.step+dt*.25)%4;
      idle=0;
    } else { player.step=0; idle+=dt/60; }
    if(idle>.6 && st<100) st=Math.min(100,st+1.4*dt);

    /* 怪物游荡 */
    monsters.forEach(m=>{
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      if(m.x<50||m.x>W-50)m.vx*=-1;
      if(m.y<50||m.y>H-50)m.vy*=-1;
      m.hit=Math.max(0,m.hit-.08*dt);
    });

    /* 投影阴影 */
    const shadow=(x,y,w)=>{ctx.fillStyle="rgba(0,0,0,.28)";ctx.beginPath();ctx.ellipse(x,y+w*.32,w*.34,w*.13,0,0,7);ctx.fill();};
    props.sort((a,b)=>a.y-b.y).forEach(p=>{
      shadow(p.x,p.y,34);
      pxSprite(p.x,p.y,p.art,30,0);
      if(p.label){
        ctx.font="11px ZCOOL KuaiLe,sans-serif"; ctx.fillStyle="rgba(0,0,0,.6)";
        const tw=ctx.measureText(p.label).width;
        ctx.fillRect(p.x-tw/2-4,p.y-26,tw+8,15);
        ctx.fillStyle="#ffe3a1"; ctx.fillText(p.label,p.x,p.y-18);
      }
    });
    npcs.sort((a,b)=>a.y-b.y).forEach(n=>{
      shadow(n.x,n.y,30); pxSprite(n.x,n.y,n.art,28,Math.sin(now/400+n.x)*2);
      ctx.font="10px ZCOOL KuaiLe,sans-serif"; ctx.fillStyle="#9fdcff";
      ctx.fillText(n.name,n.x,n.y-22);
    });
    monsters.sort((a,b)=>a.y-b.y).forEach(m=>{
      shadow(m.x,m.y,28);
      if(m.hit>0){ctx.save();ctx.globalAlpha=1;}
      pxSprite(m.x,m.y,m.art,26,0);
      if(m.hit>0){ /* 受击红闪 */
        ctx.globalCompositeOperation="source-atop";
        ctx.restore();
        ctx.fillStyle="rgba(255,60,50,"+(m.hit*.5)+")";
        ctx.fillRect(m.x-14,m.y-14,28,28);
      }
      /* 血条 */
      ctx.fillStyle="#000"; ctx.fillRect(m.x-14,m.y-24,28,5);
      ctx.fillStyle="#ff5a52"; ctx.fillRect(m.x-13,m.y-23,26*(m.hp/100),3);
    });

    /* 玩家 */
    shadow(player.x,player.y,34);
    const bob=player.step?Math.abs(Math.sin(player.step*1.6))*3:Math.sin(now/500)*1.5;
    pxSprite(player.x,player.y-2,player.art,34,-bob);
    /* 移动目标标记 */
    if(d>6){
      ctx.strokeStyle="rgba(255,233,138,.9)"; ctx.lineWidth=2;
      const rr=8+Math.sin(now/120)*3;
      ctx.strokeRect(player.tx-rr,player.ty-rr,rr*2,rr*2);
    }

    root.querySelector("#pxCoords").textContent=(player.x/8|0)+" , "+(player.y/8|0);
    updateBars();
    drawMini();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  if(globalThis.lucide && lucide.createIcons) lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
